<body><h1>Política de privacidade</h1>
<p>Mamute é um aplicativo de uso pessoal. Os dados da conta Google (agenda e tarefas) são acessados apenas pelo próprio
dono, num servidor privado dele, para exibição e organização pessoal. Nenhum dado é vendido, compartilhado com terceiros
ou usado para publicidade.</p><p><a href="index.html">Início</a></p></body></html>
